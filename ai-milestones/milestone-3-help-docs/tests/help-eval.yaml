# Golden set for Ask AI's help-docs search (AI_MILESTONE_3.md, Step 4). Run with real Gemini:
#   GOOGLE_AI_API_KEY=… ./mvnw test -Dtest=HelpDocsSearchEvalTest -Deval=true
# Each question lists every section that correctly answers it ("article#anchor"), or just the
# article when any of its sections will do. A hit is any of them in the top results (hit@4).
# "expect: []" means the docs don't cover it: nothing should come back.
# Phrased the way customers ask, not copied from headings: that's what makes the test honest.

answerable:
