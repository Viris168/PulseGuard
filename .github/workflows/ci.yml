# Runs on every push to main and every pull request: backend tests, frontend lint, tests and build.
# Nothing here deploys or publishes anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts its own PostgreSQL (and Redis where a test needs it) through the
      # runner's Docker. Test config comes from src/test/resources, so no secrets are needed.
      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # same as the Dockerfile's build stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      # Vitest with a simulated browser (jsdom): pages and the API layer, no backend needed.
      - name: Test
        run: npm test
      # tsc -b (the typecheck) then vite build.
      - name: Build
        run: npm run build
