services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseguard
      POSTGRES_USER: pulseguard
      POSTGRES_PASSWORD: pulseguard
    ports:
      - "55440:5432"
    volumes:
      - pulseguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseguard -d pulseguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pulseguard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fake SMTP server for local development: catches every email, sends none.
  # Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP: the app sends here
      - "8025:8025"   # web UI: read the emails here

volumes:
  pulseguard-postgres:
  pulseguard-redis:
