# Test-only config. The datasource comes from Testcontainers @ServiceConnection;
# everything here just satisfies the placeholders that application.yaml no longer defaults.
pulseguard.jwt.secret=dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC11c2VkLWFueXdoZXJlLWVsc2U=
pulseguard.jwt.issuer=pulseguard-test
pulseguard.jwt.audience=pulseguard-api-test
pulseguard.jwt.access-expiration=15m
pulseguard.jwt.refresh-expiration=30d

pulseguard.login.max-attempts=5
pulseguard.login.window=15m

spring.data.redis.host=localhost
spring.data.redis.port=6379
pulseguard.jwt.clock-skew=30s
pulseguard.login.max-attempts-per-ip=20
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

pulseguard.check.connect-timeout=2s
pulseguard.check.grace-timeout=1s
pulseguard.check.user-agent=PulseGuard-Test/1.0
pulseguard.check.max-error-length=500

# Quartz runs against the real job store, but no test fires jobs unless it starts the scheduler itself.
spring.quartz.auto-startup=false
spring.quartz.properties.org.quartz.threadPool.threadCount=2
pulseguard.scheduling.jitter=0s
pulseguard.scheduling.reconcile-on-startup=false

pulseguard.incident.failure-threshold=3
pulseguard.incident.recovery-threshold=2

# Tests mock the mail sender; these only let the context start.
spring.mail.host=localhost
spring.mail.port=3025
pulseguard.notification.from=PulseGuard Test <alerts@test.local>

# Caching is off in tests except where a test turns it on with its own Redis container,
# so no test can read another test's cached stats (ids repeat across test databases).
spring.cache.type=none
pulseguard.stats.cache-ttl=60s
pulseguard.status-page.cache-ttl=60s
pulseguard.heartbeat.ping-base-url=https://ping.test
pulseguard.heartbeat.sweep-interval=30s

# Stripe is never called in tests: StripeGateway is mocked, and webhook tests sign payloads
# with this secret themselves.
pulseguard.stripe.secret-key=sk_test_not_a_real_key
pulseguard.stripe.webhook-secret=whsec_test_not_a_real_secret
pulseguard.stripe.prices.PRO=price_test_pro
pulseguard.stripe.prices.BUSINESS=price_test_business
pulseguard.stripe.app-base-url=http://localhost:5173
pulseguard.stripe.connect-timeout=1s
pulseguard.stripe.read-timeout=2s
pulseguard.stripe.max-network-retries=0

# Links in alerts point here; nothing is served at it in tests.
pulseguard.app.base-url=http://localhost:5173
pulseguard.account-email.reset-token-ttl=30m
pulseguard.account-email.verify-token-ttl=24h
pulseguard.account-email.max-per-email=3
pulseguard.account-email.max-per-ip=10
pulseguard.account-email.window=1h
pulseguard.notification.retry.backoff=1m,5m,30m
pulseguard.notification.retry.sweep-interval=30s

# AI is off unless a test supplies its own ChatModel bean; nothing ever calls a real provider.
spring.ai.model.chat=none
spring.ai.model.embedding.text=none
pulseguard.ai.open-summary-ttl=10m

# Cap on a page view waiting for the model (every provider).
pulseguard.ai.timeout=20s
pulseguard.ai.fair-use-daily-questions=500
pulseguard.ai.stream-timeout=90s
pulseguard.ai.max-tool-calls=5
pulseguard.ai.tool-timeout=10s
